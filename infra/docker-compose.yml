services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: mayo-pizza:latest
    expose:
      - "3000"
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-production}
      WEB_ROOT: ${WEB_ROOT:-/app/web-dist}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-mayo.pizza}
      STUN_HOST: ${STUN_HOST:-mayo.pizza}
      TURN_HOST: ${TURN_HOST:-mayo.pizza}
      STUN_PORT: ${STUN_PORT:-3478}
      TURN_PORT: ${TURN_PORT:-3478}
      TURNS_PORT: ${TURNS_PORT:-5349}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.0.2}
      TURN_STATIC_SECRET: ${TURN_STATIC_SECRET:?TURN_STATIC_SECRET must be set}
      RATE_LIMIT_CREATE: ${RATE_LIMIT_CREATE:-10}
      RATE_LIMIT_JOIN: ${RATE_LIMIT_JOIN:-60}
      RATE_LIMIT_MESSAGE: ${RATE_LIMIT_MESSAGE:-100}
      ROOM_TTL_MS: ${ROOM_TTL_MS:-1800000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./security-headers.caddy:/etc/caddy/security-headers.caddy:ro
    depends_on:
      - app
    networks:
      default:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.2
    network_mode: host
    environment:
      TURN_STATIC_SECRET: ${TURN_STATIC_SECRET:?TURN_STATIC_SECRET must be set}
    command:
      - turnserver
      - -c
      - /etc/coturn/turnserver.conf
      - "--static-auth-secret=${TURN_STATIC_SECRET:?TURN_STATIC_SECRET must be set}"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
