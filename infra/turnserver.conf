use-auth-secret
# Deliberately omit static-auth-secret: coturn does not expand env vars here.
# infra/docker-compose.yml supplies it only as a CLI argument; a literal placeholder is a valid publicly-known secret.
realm=mayo.pizza
min-port=49160
max-port=49400
total-quota=100
# Deliberately omit bps-capacity: a rate cap does not bound monthly volume.
# If set, coturn requires max-bps too or refuses to start.
no-multicast-peers
no-cli
# Omit prometheus-username-labels: REST usernames are per-session and create unbounded, privacy-sensitive labels.
prometheus
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
